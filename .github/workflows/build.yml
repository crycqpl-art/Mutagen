name: Build Mutagen

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: Mutagen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Mutagen (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build -G "Visual Studio 17 2022" -A x64
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect plugin files
        shell: bash
        run: |
          mkdir -p out
          cp -R build/Mutagen_artefacts/Release/VST3/Mutagen.vst3 out/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/Mutagen_artefacts/Release/AU/Mutagen.component out/
            codesign --force --deep -s - out/Mutagen.vst3
            codesign --force --deep -s - out/Mutagen.component
          fi
          cp INSTRUKCJA.md out/ || true

      - name: Validate with pluginval
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -sSfL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests --validate-in-process out/Mutagen.vst3
          else
            curl -sSfL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            unzip -q pv.zip
            ./pluginval.exe --strictness-level 8 --skip-gui-tests --validate-in-process out/Mutagen.vst3
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mutagen-${{ matrix.name }}
          path: Mutagen/out
